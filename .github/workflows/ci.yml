name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64-neon

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Test (Release)
        run: dotnet test tests/IspcSharp.Tests/IspcSharp.Tests.csproj -c Release --nologo

      - name: Test (software fallback)
        run: dotnet test tests/IspcSharp.Tests/IspcSharp.Tests.csproj -c Release --nologo
        env:
          DOTNET_EnableHWIntrinsic: "0"

  benchmarks:
    name: benchmarks (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64-neon

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Run benchmarks
        run: >
          dotnet run
          -c Release
          --project benchmarks/IspcSharp.Benchmarks
          --
          --filter '*'
          --job short

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.label }}
          path: BenchmarkDotNet.Artifacts/results/**
          if-no-files-found: warn

      # Hosted runners are sometimes AVX-512 machines (JIT target x86-64-v4) and sometimes not, and
      # SIMD kernels have measured very differently on the two. When this runner has AVX-512, run
      # the suite a second time with it switched off: same machine, same job, so the two passes
      # are directly comparable. The report shows them side by side.
      - name: Detect AVX-512
        id: isa
        shell: pwsh
        run: |
          $has = [System.Runtime.Intrinsics.X86.Avx512F]::IsSupported
          "avx512=$($has.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "AVX-512 available: $has"

      - name: Run benchmarks (AVX-512 disabled)
        if: steps.isa.outputs.avx512 == 'true'
        env:
          # .NET 10+ switch names; AVX10 implies the same instructions, so it goes off too.
          DOTNET_EnableAVX512: "0"
          DOTNET_EnableAVX10v1: "0"
        run: >
          dotnet run
          -c Release
          --project benchmarks/IspcSharp.Benchmarks
          --
          --filter '*'
          --job short
          --artifacts BenchmarkDotNet.Artifacts.NoAvx512

      - name: Upload benchmark results (AVX-512 disabled)
        if: steps.isa.outputs.avx512 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.label }}-no-avx512
          path: BenchmarkDotNet.Artifacts.NoAvx512/results/**
          if-no-files-found: warn

  combine-benchmarks:
    name: Combine benchmark results
    if: github.event_name == 'workflow_dispatch'

    needs: benchmarks

    runs-on: ubuntu-latest

    steps:
      - name: Check out the report script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: benchmark-results

      # Speedup-over-scalar tables with bars, Mermaid charts, and the raw times.
      # Run it locally the same way against a folder of downloaded artifacts.
      - name: Build comparison report
        run: python3 .github/scripts/benchmark_report.py benchmark-results benchmark-summary.md

      - name: Publish summary
        run: cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-summary.md